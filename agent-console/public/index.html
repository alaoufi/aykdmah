<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14294e"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script><title>وكيل التطوير — جميع المشاريع</title></head>
<body><div class="shell">
<header><div><strong>◈ وكيل التطوير</strong><small>مساحة المشاريع الخاصة · Codex</small></div><button class="ghost" id="logout" hidden>خروج</button></header>
<section id="login"><h2>الدخول الآمن</h2><p>أدخل كلمة مرور الوكيل للوصول إلى مشاريعك.</p><form id="loginForm">
<label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required aria-describedby="loginError"><button>دخول</button></form><p class="error" id="loginError" role="alert"></p></section>
<section id="chat" hidden><main id="messages" aria-live="polite"></main>
<div class="panel"><div class="controls"><label for="project">المشروع</label><select id="project"></select><button type="button" class="ghost" id="jobs" aria-expanded="false">متابعة المهام</button><button type="button" class="ghost" id="stores">المتاجر</button><button type="button" class="ghost" id="notify">تفعيل الإشعارات</button></div>
<div id="tasks" hidden></div><div id="status" role="status"></div>
<form id="sendForm"><label for="prompt">طلب التطوير</label><textarea id="prompt" placeholder="ما الذي تريد إنجازه؟" required maxlength="8000"></textarea>
<label for="acceptance">كيف نختبر النتيجة؟</label><textarea id="acceptance" placeholder="إذا تركت هذا الحقل فارغًا تنتظر المهمة استكمال التفاصيل." maxlength="2000"></textarea>
<div class="actions"><span class="note">Codex أولًا · Claude احتياطي يدوي</span><button id="send">إرسال الطلب</button></div></form>
</div></section></div></body></html>
