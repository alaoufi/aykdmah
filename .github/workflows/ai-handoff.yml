name: AI handoff intake (safe)
on:
  pull_request_target:
    types: [labeled]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  handoff:
    if: github.event.label.name == 'handoff:codex' || github.event.label.name == 'handoff:claude'
    runs-on: ubuntu-latest
    steps:
      - name: Record handoff issue without executing untrusted PR code
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const agent = context.payload.label.name.split(':')[1];
            const marker = `<!-- ai-handoff-pr:${pr.number} agent:${agent} -->`;
            const title = `[AI handoff → ${agent}] PR #${pr.number}: ${pr.title}`;
            const body = `${marker}\n\n**Queue for:** ${agent}\n**PR:** ${pr.html_url}\n**Head:** ${pr.head.ref} (${pr.head.sha})\n**Base:** ${pr.base.ref} (${pr.base.sha})\n\nRead \`AGENTS.md\`, \`CLAUDE.md\` and \`docs/AI_COORDINATION.md\` before work. Review only; do not deploy or merge without owner approval.\n\nThis creates an auditable handoff ticket; it does not invoke a model.\n`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100});
            const existing = issues.find(i => !i.pull_request && i.body?.includes(marker));
            if (!existing) {
              await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body});
            }
            await github.rest.issues.createComment({
              owner:context.repo.owner,repo:context.repo.repo,issue_number:pr.number,
              body:`Handoff queued for **${agent}**. See repository Issues. This workflow does **not** automatically start an AI agent; provider installation/authorization is still required.`
            });
