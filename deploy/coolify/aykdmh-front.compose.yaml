# Hosts the existing site's HTTP frontend only. Its backend, DB, media and
# LiveKit retain their existing owners and are not recreated by Coolify.
services:
  frontend:
    image: sha256:44fab56905377e476d463ac46d1b2a26897aea69c59c16c60cd0c621e679210b
    pull_policy: never
    entrypoint: /usr/bin/caddy
    command: [run, --config, /etc/site/Caddyfile, --adapter, caddyfile]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 1.0
    pids_limit: 128
    restart: unless-stopped
    environment:
      XDG_CONFIG_HOME: /tmp/config
      XDG_DATA_HOME: /tmp/data
    ports: ["172.18.0.1:8093:8080"]
    volumes:
      - /etc/aykdmh/coolify-site/Caddyfile:/etc/site/Caddyfile:ro
      - /var/www/aykdmh:/srv:ro
    tmpfs: ["/tmp:size=16m,mode=1777"]
    networks: [existing]
    healthcheck:
      test: [CMD-SHELL, "wget -q --spider http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  existing:
    external: true
    name: aykdmh_default
