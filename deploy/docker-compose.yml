# aykdmh.com production stack. Runs alongside the private Coolify install without
# touching it. Only Caddy is published; the API and database stay on the internal network.
# Start: docker compose -p aykdmh --env-file /opt/aykdmh/.env -f deploy/docker-compose.yml up -d
services:
  web:
    # Caddy 2.11.4 + layer4 (deploy/caddy.Dockerfile): calls also travel over 443 (AYK-051).
    build:
      context: .
      dockerfile: caddy.Dockerfile
    image: aykdmh-web:2.11.4-l4
    container_name: aykdmh-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Mount the directory, not the file, so `git pull` changes are seen on reload.
      - ./caddy:/etc/caddy:ro
      - /var/www/aykdmh:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: ..
      dockerfile: deploy/app.Dockerfile
    image: aykdmh-app:latest
    container_name: aykdmh-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_PORT: "5000"
      APP_URL: https://aykdmh.com
      CLIENT_URL: https://aykdmh.com
      TRUST_PROXY: "1"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: aykdmh
      DB_USER: aykdmh
      DB_PASSWORD: ${DB_PASSWORD:?set in /opt/aykdmh/.env}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?set in /opt/aykdmh/.env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set in /opt/aykdmh/.env}
      # AYK-013: payments run in test mode (no money moves) until a real gateway is approved.
      PAYMENT_PROVIDER: test
      LIVEKIT_URL: wss://aykdmh.com/livekit
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: aykdmh
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set in /opt/aykdmh/.env}
      # AYK-008: incoming-call notifications (VAPID keys generated by setup-server.sh).
      PUSH_PUBLIC_KEY: ${PUSH_PUBLIC_KEY:-}
      PUSH_PRIVATE_KEY: ${PUSH_PRIVATE_KEY:-}
      PUSH_SUBJECT: https://aykdmh.com
      # AYK-094: the Android app's ringing calls (Firebase service-account key, base64; .env only).
      FCM_SERVICE_ACCOUNT_B64: ${FCM_SERVICE_ACCOUNT_B64:-}
      # AYK-119: Microsoft Translator (free F0) for chat translation; .env only.
      AZURE_TRANSLATOR_KEY: ${AZURE_TRANSLATOR_KEY:-}
      AZURE_TRANSLATOR_REGION: ${AZURE_TRANSLATOR_REGION:-global}
    volumes:
      - uploads:/app/server/uploads
      # AYK-032: the active client release, read for search-engine pages (index.html only).
      - /var/www/aykdmh:/srv/site:ro
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  # Calls: self-hosted LiveKit. Media ports are published directly; signaling goes through Caddy,
  # and so does TURN over TLS on 443 (Caddy -> livekit:5349, internal only) for networks that block the rest.
  livekit:
    image: livekit/livekit-server:v1.13.9
    container_name: aykdmh-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml --node-ip ${LIVEKIT_NODE_IP:-84.247.166.216}
    environment:
      LIVEKIT_KEYS: "aykdmh: ${LIVEKIT_API_SECRET:?set in /opt/aykdmh/.env}"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
      - "3478:3478/udp"
    cpus: 4
    mem_limit: 4g
    logging: *logging

  db:
    image: postgres:16-alpine
    container_name: aykdmh-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aykdmh
      POSTGRES_USER: aykdmh
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in /opt/aykdmh/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aykdmh -d aykdmh"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  uploads:
