# nginx site for aykdmh.com (HTTP only; certbot --nginx adds the 443 block and redirect).
# Serves the static homepage now. When the app is deployed, uncomment the /api
# location and point it at the Node server.
server {
    listen 80;
    listen [::]:80;
    server_name aykdmh.com www.aykdmh.com;

    root /var/www/aykdmh/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Missing build assets must 404, never fall back to index.html (Safari MIME issue in the handover).
    location ~* ^/assets/|\.(js|mjs|wasm|css|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # location /api/ {
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
