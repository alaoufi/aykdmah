# Self-hosted LiveKit (open source, Apache-2.0) for one-to-one calls on aykdmh.com.
# Signaling: wss://aykdmh.com/livekit (Caddy strips /livekit and proxies to :7880).
# Media: one UDP port (7882) plus ICE/TCP (7881), TURN/UDP (3478) and TURN/TLS on 443
# (through Caddy) as fallbacks for restrictive networks. The API key secret comes from LIVEKIT_KEYS in the
# environment, never from this file.
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
room:
  auto_create: false
  empty_timeout: 60
  departure_timeout: 20
  max_participants: 2
turn:
  enabled: true
  udp_port: 3478
  # AYK-051: TURN over TLS on 443 through Caddy, which holds the aykdmh.com certificate
  # and forwards decrypted TURN to this port (internal only). Works where UDP and
  # uncommon ports are blocked; LiveKit advertises turns:aykdmh.com:443 to clients.
  domain: aykdmh.com
  tls_port: 5349
  external_tls: true
webhook:
  api_key: aykdmh
  urls:
    - http://app:5000/api/calls/livekit-webhook
logging:
  level: info
  json: true
